name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: bilibili_talks_test
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: ephemeral_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_runner -d bilibili_talks_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test_runner:ephemeral_ci_only@127.0.0.1:5432/bilibili_talks_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: pip install -r backend/requirements-dev.lock
      - run: pip install --no-deps -e backend
      - run: python -m pytest backend/tests
      - run: ruff check backend scripts
      - run: docker compose config --quiet
      - run: docker build -t bilibili-talk-view:ci .
