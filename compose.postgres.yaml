services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: bilibili_talks
      POSTGRES_USER: bilibili
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - discussion_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bilibili -d bilibili_talks"]
      interval: 3s
      timeout: 3s
      retries: 20
  db-test:
    image: postgres:18
    profiles: [test]
    environment:
      POSTGRES_DB: bilibili_talks_test
      POSTGRES_USER: bilibili
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bilibili -d bilibili_talks_test"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  discussion_pg:
